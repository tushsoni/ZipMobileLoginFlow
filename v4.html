<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zip Mobile Login Flow</title>
<style>
* { margin: 0px; padding: 0px; box-sizing: border-box; }
body { background: rgb(26, 26, 46); display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.phone-frame { width: 375px; height: 812px; background: rgb(43, 45, 66); border-radius: 44px; overflow: hidden; position: relative; box-shadow: rgb(26, 26, 46) 0px 0px 0px 3px, rgb(58, 58, 92) 0px 0px 0px 6px, rgba(0, 0, 0, 0.5) 0px 20px 60px; }
.status-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 28px 0px; height: 50px; }
.status-time { font-size: 15px; font-weight: 600; color: rgb(255, 255, 255); letter-spacing: 0.3px; }
.status-icons { display: flex; align-items: center; gap: 5px; }
.top-bar { display: flex; justify-content: space-between; align-items: center; padding: 8px 20px 0px; }
.altametrics-logo { display: flex; align-items: center; gap: 6px; }
.altametrics-icon { width: 28px; height: 28px; border: 2px solid rgb(255, 255, 255); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.altametrics-icon svg { width: 14px; height: 14px; }
.altametrics-text { color: rgb(255, 255, 255); font-size: 13px; font-weight: 500; letter-spacing: 0.3px; }
.altametrics-text span { display: block; font-size: 9px; color: rgb(141, 143, 163); font-weight: 400; margin-top: -1px; }
.version { color: rgb(255, 255, 255); font-size: 11px; font-style: italic; margin-left: 6px; }
.hamburger { display: flex; flex-direction: column; gap: 4px; cursor: pointer; }
.hamburger span { display: block; width: 22px; height: 2px; background: rgb(78, 168, 219); border-radius: 1px; }
.app-content { display: flex; flex-direction: column; align-items: center; padding: 24px 24px 0px; }
.clock-icon { margin-top: 16px; margin-bottom: 16px; }
.clock-icon svg { width: 64px; height: 64px; }
.logo { margin-bottom: 28px; text-align: center; }
.logo-zip { font-size: 36px; font-weight: 800; color: rgb(78, 168, 219); letter-spacing: 2px; font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif; font-style: italic; }
.logo-clock { font-size: 36px; font-weight: 300; color: rgb(255, 255, 255); letter-spacing: 1px; font-family: "Helvetica Neue", Arial, sans-serif; }
.logo-r { font-size: 14px; color: rgb(255, 255, 255); vertical-align: super; font-weight: 400; }
.tabs { display: flex; width: 100%; margin-bottom: 24px; position: relative; }
.tab { text-align: left; padding: 10px 0px; font-size: 15px; cursor: pointer; border: none; background: none; font-family: inherit; transition: 0.3s; }
.tab-email { flex: 1.6 1 0%; color: rgb(255, 255, 255); font-weight: 600; border-bottom: 2.5px solid rgb(78, 168, 219); font-size: 16px; }
.tab-phone { flex: 1 1 0%; color: rgb(85, 87, 112); font-weight: 400; border-bottom: 1px solid rgb(58, 60, 80); font-size: 13px; letter-spacing: 0px; }
.tab-email.active { color: rgb(255, 255, 255); font-weight: 600; border-bottom: 2.5px solid rgb(78, 168, 219); font-size: 16px; }
.tab-email:not(.active) { flex: 1 1 0%; color: rgb(107, 109, 130); font-weight: 400; border-bottom: 1px solid rgb(58, 60, 80); font-size: 14px; }
.tab-phone.active { color: rgb(192, 194, 208); font-weight: 500; border-bottom: 2px solid rgb(74, 106, 128); font-size: 14px; flex: 1 1 0%; }
.tab-phone:not(.active) { color: rgb(85, 87, 112); font-weight: 400; border-bottom: 1px solid rgb(58, 60, 80); font-size: 13px; }
.form-section { width: 100%; display: none; animation: 0.3s ease 0s 1 normal none running fadeIn; }
.form-section.active { display: block; }
@keyframes fadeIn { 
  0% { opacity: 0; transform: translateY(6px); }
  100% { opacity: 1; transform: translateY(0px); }
}
.input-group { display: flex; align-items: center; border-bottom: 1px solid rgb(74, 76, 98); padding: 12px 0px; margin-bottom: 4px; gap: 10px; }
.input-group .icon { width: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.input-group .icon svg { width: 18px; height: 18px; fill: rgb(141, 143, 163); }
.input-group .separator { width: 1px; height: 20px; background: rgb(74, 76, 98); flex-shrink: 0; }
.input-group input { flex: 1 1 0%; background: none; border: none; outline: none; color: rgb(141, 143, 163); font-size: 15px; font-family: inherit; letter-spacing: 0.2px; }
.input-group input::placeholder { color: rgb(107, 109, 130); }
.phone-prefix { display: flex; align-items: center; gap: 4px; flex-shrink: 0; color: rgb(141, 143, 163); font-size: 15px; }
.flag-icon { width: 22px; height: 15px; border-radius: 2px; overflow: hidden; display: flex; flex-direction: column; flex-shrink: 0; }
.flag-stripe-red { background: rgb(178, 34, 52); height: 33.33%; width: 100%; }
.flag-stripe-white { background: rgb(255, 255, 255); height: 33.33%; width: 100%; }
.flag-stripe-blue { background: rgb(60, 59, 110); height: 33.33%; width: 100%; }
.links-row { display: flex; justify-content: space-between; width: 100%; margin-top: 4px; margin-bottom: 28px; }
.link { color: rgb(78, 168, 219); font-size: 13px; text-decoration: none; cursor: pointer; }
.validation-text { color: rgb(107, 109, 130); font-size: 11.5px; margin-top: 2px; margin-bottom: 28px; width: 100%; }
.login-btn-email { width: 240px; padding: 15px 0px; border: none; border-radius: 28px; font-size: 17px; font-weight: 600; color: rgb(255, 255, 255); cursor: pointer; background: linear-gradient(rgb(110, 195, 232) 0%, rgb(74, 159, 212) 40%, rgb(58, 127, 191) 100%); box-shadow: rgba(74, 159, 212, 0.35) 0px 6px 20px; letter-spacing: 0.5px; font-family: inherit; margin-bottom: 18px; transition: transform 0.15s, box-shadow 0.15s; }
.login-btn-email:active { transform: scale(0.97); }
.login-btn-phone { width: 200px; padding: 12px 0px; border: 1.5px solid rgb(74, 106, 128); border-radius: 28px; font-size: 14px; font-weight: 500; color: rgb(141, 154, 176); cursor: pointer; background: rgba(78, 168, 219, 0.08); box-shadow: none; letter-spacing: 0.3px; font-family: inherit; margin-bottom: 18px; transition: transform 0.15s; }
.login-btn-phone:active { transform: scale(0.97); }
.pin-link { color: rgb(78, 168, 219); font-size: 14px; text-decoration: none; cursor: pointer; font-weight: 500; }
.recommended-badge { display: inline-block; background: rgba(78, 168, 219, 0.15); color: rgb(79, 219, 114); font-size: 9px; font-weight: 600; padding: 2px 7px; border-radius: 8px; letter-spacing: 0.5px; text-transform: uppercase; margin-left: 6px; vertical-align: middle; }
.phone-notice { display: flex; align-items: flex-start; gap: 8px; background: rgba(255, 180, 50, 0.06); border: 1px solid rgba(255, 180, 50, 0.15); border-radius: 10px; padding: 10px 12px; margin-bottom: 20px; }
.phone-notice-icon { flex-shrink: 0; margin-top: 1px; }
.phone-notice-text { color: rgb(141, 143, 163); font-size: 11px; line-height: 1.45; }
.phone-notice-text strong { color: rgb(192, 160, 80); font-weight: 600; }
.phone-notice-link { color: rgb(78, 168, 219); font-size: 11.5px; text-decoration: none; cursor: pointer; font-weight: 500; }
.home-indicator { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; background: rgb(255, 255, 255); border-radius: 3px; opacity: 0.3; }
.login-section { display: flex; flex-direction: column; align-items: center; width: 100%; }
.login-button-wrapper { margin-bottom: 18px; }
.login-links-row { display: flex; justify-content: space-between; width: 100%; margin-bottom: 0px; }
.login-links-row .link { font-size: 13px; }
.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 1000; justify-content: center; align-items: center; }
.modal.active { display: flex; }
.modal-content { background: #ffffff; border-radius: 16px; width: 85%; max-width: 340px; padding: 24px 20px 20px; position: relative; }
.modal-title { display: flex; align-items: center; justify-content: center; gap: 7px; color: #d0021b; font-size: 18px; font-weight: 700; margin-bottom: 14px; text-align: center; }
.modal-title svg { flex-shrink: 0; }
.alert-message { display: flex; align-items: flex-start; gap: 9px; background: #fff5f5; border: 1.5px solid #f5c2c7; border-radius: 10px; padding: 11px 13px; margin-bottom: 22px; color: #c0392b; font-size: 13px; line-height: 1.55; text-align: left; }
.alert-buttons { display: flex; flex-direction: column; gap: 10px; }
.btn-continue-email { width: 100%; padding: 13px 0; border: none; border-radius: 24px; font-size: 15px; font-weight: 600; color: #fff; cursor: pointer; background: linear-gradient(rgb(110,195,232) 0%, rgb(74,159,212) 40%, rgb(58,127,191) 100%); box-shadow: rgba(74,159,212,0.3) 0px 4px 14px; font-family: inherit; transition: transform 0.15s; }
.btn-continue-email:active { transform: scale(0.97); }
.btn-phone-login { width: 100%; padding: 12px 0; border: 1.5px solid #d0021b; border-radius: 24px; font-size: 14px; font-weight: 500; color: #d0021b; cursor: pointer; background: none; font-family: inherit; transition: transform 0.15s; }
.btn-phone-login:active { transform: scale(0.97); }
.phone-modal-input-group { display: flex; align-items: center; border-bottom: 1.5px solid #d0d3de; padding: 12px 0; margin-bottom: 4px; gap: 10px; }
.phone-modal-separator { width: 1px; height: 20px; background: #d0d3de; flex-shrink: 0; }
.phone-modal-input-group input { flex: 1; background: none; border: none; outline: none; color: #333; font-size: 15px; font-family: inherit; }
.phone-modal-input-group input::placeholder { color: #aaa; }
.phone-modal-prefix { display: flex; align-items: center; gap: 4px; flex-shrink: 0; color: #444; font-size: 15px; }
.phone-modal-validation { color: #888; font-size: 11.5px; margin-top: 6px; margin-bottom: 22px; }
.phone-modal-title { color: #1a1a2e; font-size: 17px; font-weight: 700; margin-bottom: 20px; text-align: center; }
.btn-otp { width: 100%; padding: 13px 0; border: none; border-radius: 24px; font-size: 15px; font-weight: 600; color: #fff; cursor: pointer; background: linear-gradient(rgb(110,195,232) 0%, rgb(74,159,212) 40%, rgb(58,127,191) 100%); box-shadow: rgba(74,159,212,0.3) 0px 4px 14px; font-family: inherit; transition: transform 0.15s; }
.btn-otp:active { transform: scale(0.97); }

</style>
</head>
<body>

<div class="phone-frame">
  <!-- Status Bar -->
  <div class="status-bar">
    <div class="status-time">11:38 ◄</div>
    <div class="status-icons">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
        <rect x="0" y="6" width="3" height="6" rx="0.5" fill="#fff"/>
        <rect x="4" y="4" width="3" height="8" rx="0.5" fill="#fff"/>
        <rect x="8" y="2" width="3" height="10" rx="0.5" fill="#fff"/>
        <rect x="12" y="0" width="3" height="12" rx="0.5" fill="#fff"/>
      </svg>
      <span style="color:#fff;font-size:11px;font-weight:600;">4G</span>
      <svg width="26" height="13" viewBox="0 0 26 13" fill="none">
        <rect x="0.5" y="0.5" width="22" height="12" rx="2" stroke="#fff" stroke-opacity="0.5"/>
        <rect x="2" y="2" width="16" height="9" rx="1" fill="#4CD964"/>
        <rect x="23.5" y="4" width="2.5" height="5" rx="1" fill="#fff" fill-opacity="0.5"/>
      </svg>
    </div>
  </div>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="altametrics-logo">
      <img src="https://agcdn.altametrics.com/releaseHubWorks/agassets/v3/assets/images/logo/hw_header_white.svg" alt="HubWorks Logo" style="height: 28px; width: auto;">
      <span class="version">v 1.3.1</span>
    </div>
    <div class="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>

  <!-- App Content -->
  <div class="app-content">
    <!-- Clock Icon -->
    <div class="clock-icon">
      <img src="https://agcdn.altametrics.com/releaseHubWorks/agassets/v3/assets/images/account/svg/zipclock_white.svg" alt="ZipClock Icon" style="width: 64px; height: 64px;">
    </div>

    <!-- Logo -->
    <div class="logo">
      <span class="logo-zip">ZIP</span><span class="logo-clock">clock</span><span class="logo-r">®</span>
    </div>

    <!-- Tabs -->
    <!-- <div class="tabs">
      <button class="tab tab-email active" id="tab-email" onclick="switchTab('email')">
        Email ID <span class="recommended-badge">Recommended</span>
      </button>
    </div> -->

    <!-- Email Form -->
    <div class="form-section active" id="form-email">
      <div class="input-group">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="#8d8fa3">
            <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
          </svg>
        </div>
        <div class="separator"></div>
        <input type="email" placeholder="Email ID" autofocus>
      </div>

      <div class="input-group">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="#8d8fa3">
            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zM9 8V6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9z"/>
          </svg>
        </div>
        <div class="separator"></div>
        <input type="password" placeholder="Password">
      </div>

      <div class="links-row">
        <a class="link">Need Support?</a>
        <a class="link">Forgot Password?</a>
      </div>

      <div class="login-section">
        <div class="login-button-wrapper">
          <button class="login-btn-email">Login</button>
        </div>
        <div class="login-links-row" style="justify-content: center;">
          <a class="link" onclick="openPhoneModal()">Login with Phone No.</a>
        </div>
      </div>
    </div>


  </div>

  <!-- Home Indicator -->
  <div class="home-indicator"></div>
</div>

<!-- Alert Modal -->
<div class="modal" id="alertModal">
  <div class="modal-content">
    <div class="modal-title">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#d0021b">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
      </svg>
      Alert
    </div>
    <div class="alert-message">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="#c0392b" style="flex-shrink:0;margin-top:1px;">
        <path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/>
      </svg>
      <span>Phone Login with OTP will be deprecated in upcoming release. We recommend using your Email ID instead.</span>
    </div>
    <div class="alert-buttons">
      <button class="btn-continue-email" onclick="continueWithEmail()">Proceed with Email</button>
      <button class="btn-phone-login" onclick="proceedToPhoneLogin()">Continue with Phone No.</button>
    </div>
  </div>
</div>

<!-- Phone Login Modal -->
<div class="modal" id="phoneModal">
  <div class="modal-content">
    <div class="phone-modal-title">Login with Phone No.</div>

    <div class="phone-modal-input-group">
      <div class="phone-modal-prefix">
        <div class="flag-icon">
          <div class="flag-stripe-red"></div>
          <div class="flag-stripe-white"></div>
          <div class="flag-stripe-blue"></div>
        </div>
        <span>+1</span>
      </div>
      <div class="phone-modal-separator"></div>
      <input type="tel" placeholder="Phone Number">
    </div>

    <div class="phone-modal-validation">Validate your Phone Number with one time password</div>

    <button class="btn-otp">Login via OTP</button>
  </div>
</div>

<script>
  function openPhoneModal() {
    document.getElementById('alertModal').classList.add('active');
  }

  function continueWithEmail() {
    document.getElementById('alertModal').classList.remove('active');
  }

  function proceedToPhoneLogin() {
    document.getElementById('alertModal').classList.remove('active');
    document.getElementById('phoneModal').classList.add('active');
  }

  function closePhoneModal() {
    document.getElementById('phoneModal').classList.remove('active');
  }

  window.onclick = function(event) {
    const alertModal = document.getElementById('alertModal');
    const phoneModal = document.getElementById('phoneModal');
    if (event.target === alertModal) alertModal.classList.remove('active');
    if (event.target === phoneModal) phoneModal.classList.remove('active');
  }
</script>

</body>
</html>
